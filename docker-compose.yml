services:
  db:
    image: postgres:18-alpine
    container_name: bausastra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bausastra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bausastra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bausastra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bausastra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: bausastra-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bausastra"
version = "0.1.0"
description = "Javanese dictionary mapping workspace + scraper"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "SQLAlchemy>=2.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "trafilatura>=1.8",
  "pandas>=2.0",
  "datasets>=2.18",
  "huggingface-hub>=0.22",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "click>=8.1",
  "flask>=3.0",
  "flask-cors>=4.0",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
prod = ["gunicorn>=21.2"]

[tool.setuptools.packages.find]
where = ["src"]
